apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-monitor
  namespace: stock-monitor
  labels:
    app: stock-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-monitor
  template:
    metadata:
      labels:
        app: stock-monitor
    spec:
      containers:
        - name: stock-monitor
          image: stock-monitor:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: stock-monitor-config
            - secretRef:
                name: stock-monitor-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
